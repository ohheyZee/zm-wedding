<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Locked In!</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --cream: #18151200;
    --blush: #e8d5c4;
    --rose: #c9a89a;
    --deep: #e2d8cf;
    --sage: #8a9e8c;
    --gold: #c8a96e;
    --muted: #7a6e66;
    --card: #1e1b18;
    --border: #2e2924;
    --red-soft: #e8a097;
    --green-soft: #8fba8f;
    --amber-soft: #d4a862;
    --blue-soft: #7fa8c9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #121009;
    color: var(--deep);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .hero {
    background: #0d0b09;
    padding: 52px 32px 44px;
    text-align: center;
    position: relative;
    overflow: hidden;
    border-top: 3px solid transparent;
    border-image: linear-gradient(90deg, transparent, var(--gold), transparent) 1;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(200,169,110,0.22) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-dot {
    position: absolute;
    border-radius: 50%;
    background: rgba(200,169,110,0.12);
    animation: floatDot 6s ease-in-out infinite;
  }
  .hero-dot:nth-child(1) { width:120px;height:120px;top:-30px;left:8%;animation-delay:0s; }
  .hero-dot:nth-child(2) { width:70px;height:70px;top:20px;right:12%;animation-delay:1.5s; }
  .hero-dot:nth-child(3) { width:50px;height:50px;bottom:10px;left:20%;animation-delay:3s; }
  @keyframes floatDot {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(26px, 6vw, 54px);
    font-weight: 300;
    color: var(--blush);
    line-height: 1.25;
    letter-spacing: 1px;
    position: relative;
    animation: fadeUp 0.6s ease both;
    animation-delay: 0.1s;
    word-break: break-word;
  }
  .hero-title em {
    font-style: italic;
    background: linear-gradient(135deg, #e8c97a 0%, #c8a96e 40%, #f0dfa0 70%, #c8a96e 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .hero-locked {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(13px, 2.5vw, 18px);
    color: var(--blush);
    opacity: 0.85;
    margin-top: 6px;
    position: relative;
    animation: fadeUp 0.6s ease both;
    animation-delay: 0.18s;
  }
  .hero-divider {
    width: 48px;
    height: 1px;
    background: var(--gold);
    margin: 18px auto 16px;
    opacity: 0.6;
    position: relative;
    animation: fadeUp 0.6s ease both;
    animation-delay: 0.25s;
  }
  .hero-date {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(15px, 3.5vw, 20px);
    font-weight: 300;
    font-style: italic;
    color: var(--blush);
    opacity: 0.85;
    position: relative;
    animation: fadeUp 0.6s ease both;
    animation-delay: 0.35s;
  }
  .countdown-strip {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 22px;
    position: relative;
    animation: fadeUp 0.6s ease both;
    animation-delay: 0.45s;
  }
  .countdown-pill {
    display: inline-flex;
    align-items: baseline;
    gap: 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(200,169,110,0.25);
    border-radius: 40px;
    padding: 10px 28px;
  }
  .countdown-pill .n {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(32px, 7vw, 48px);
    font-weight: 300;
    color: var(--gold);
    line-height: 1;
  }
  .countdown-pill .l {
    font-size: clamp(10px, 2vw, 13px);
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--muted);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .nav-wrap {
    background: #181410;
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    display: flex;
    gap: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .nav-wrap::-webkit-scrollbar { display: none; }
  .tab-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 18px 24px;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .tab-btn:hover { color: var(--deep); }
  .tab-btn.active { color: var(--deep); border-bottom-color: var(--gold); }
  .content { padding: 36px 32px; max-width: 1200px; margin: 0 auto; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    min-width: 0;
  }
  .stat-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .stat-value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 42px;
    font-weight: 300;
    color: var(--deep);
    line-height: 1;
  }
  .stat-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .section-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    background: #252118;
    flex-wrap: wrap;
    gap: 8px;
  }
  .section-title-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .section-title-input {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 400;
    color: var(--deep);
    border: none;
    background: transparent;
    outline: none;
    border-bottom: 1px dashed transparent;
    transition: border-color 0.2s;
    min-width: 0;
    width: 100%;
    max-width: 260px;
  }
  .section-title-input:hover, .section-title-input:focus { border-bottom-color: var(--gold); }
  .section-count {
    font-size: 11px;
    background: #3a2e22;
    color: var(--blush);
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 500;
    flex-shrink: 0;
  }
  .btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .btn-gold { background: var(--gold); color: #1a1208; }
  .btn-gold:hover { background: #b8943d; }
  .table-scroll-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; width: 100%; }
  .vendor-table { width: 100%; border-collapse: collapse; }
  .vendor-table th {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 12px 16px;
    text-align: left;
    background: #252118;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  .vendor-table td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
    font-size: 14px;
  }
  .vendor-table tr:last-child td { border-bottom: none; }
  .vendor-table tr:hover td { background: #252118; }
  .editable-cell {
    border: none;
    background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--deep);
    width: 100%;
    min-width: 0;
    outline: none;
    border-bottom: 1px dashed transparent;
    transition: border-color 0.2s;
    padding: 2px 0;
    white-space: normal;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  .editable-cell:hover, .editable-cell:focus { border-bottom-color: var(--gold); }
  .pill {
    display: inline-block;
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
    border: none;
    font-family: 'DM Sans', sans-serif;
    white-space: nowrap;
  }
  .pill:hover { opacity: 0.8; transform: scale(0.97); }
  .pill-red    { background: #3a1e1e; color: #d4908a; }
  .pill-green  { background: #1a2e1a; color: #7ab87a; }
  .pill-amber  { background: #2e2010; color: #c89a52; }
  .pill-grey   { background: #28221e; color: var(--muted); }
  .pill-blue   { background: #162030; color: #6a9ec0; }
  .pill-rose   { background: #351a1a; color: #c08080; }
  .add-row td { background: #252118; }
  .add-input {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--deep);
    background: #2a2420;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    width: 100%;
    min-width: 0;
    outline: none;
    transition: border-color 0.2s;
  }
  .add-input:focus { border-color: var(--gold); }
  .add-input::placeholder { color: #5a504a; }
  .guest-table { width: 100%; border-collapse: collapse; min-width: 380px; }
  .guest-table th {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 12px 16px;
    text-align: left;
    background: #252118;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  .guest-table td {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
    font-size: 14px;
  }
  .guest-table tr:last-child td { border-bottom: none; }
  .guest-table tr:hover td { background: #252118; }
  .rsvp-summary {
    background: #0d0b09;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 32px;
    margin-bottom: 24px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 24px;
  }
  .rsvp-stat { text-align: center; }
  .rsvp-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 46px;
    font-weight: 300;
    color: var(--gold);
    line-height: 1;
    display: block;
  }
  .rsvp-label {
    font-size: 10px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--blush);
    opacity: 0.7;
    margin-top: 4px;
    display: block;
  }
  .rsvp-bar-wrap {
    background: rgba(255,255,255,0.06);
    border-radius: 4px;
    height: 4px;
    margin-top: 12px;
    overflow: hidden;
  }
  .rsvp-bar-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 4px;
    transition: width 0.4s ease;
  }
  .checklist-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }
  .checklist-item:last-of-type { border-bottom: none; }
  .checklist-item:hover { background: #252118; }
  .check-box {
    width: 20px; height: 20px;
    border: 2px solid #3a3028;
    border-radius: 6px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
    background: transparent;
  }
  .check-box.checked { background: var(--sage); border-color: var(--sage); }
  .check-box.checked::after {
    content: '';
    width: 5px; height: 9px;
    border: 2px solid #121009;
    border-top: none;
    border-left: none;
    transform: rotate(45deg) translateY(-1px);
    display: block;
  }
  .check-label {
    flex: 1;
    font-size: 14px;
    cursor: text;
    outline: none;
    border-bottom: 1px dashed transparent;
    transition: all 0.2s;
    min-width: 0;
    word-break: break-word;
    color: var(--deep);
  }
  .check-label:hover, .check-label:focus { border-bottom-color: var(--gold); }
  .check-label.done { text-decoration: line-through; color: var(--muted); }
  .progress-bar-wrap {
    height: 6px;
    background: #2e2924;
    border-radius: 3px;
    overflow: hidden;
    margin: 0 20px 16px;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--sage), var(--gold));
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .progress-label {
    font-size: 11px;
    color: var(--muted);
    padding: 8px 20px 4px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 4px;
  }
  .checklist-add {
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: #252118;
    flex-wrap: wrap;
  }
  .checklist-add .add-input { flex: 1; min-width: 160px; }
  @media (max-width: 640px) {
    .content { padding: 16px 12px; }
    .hero { padding: 36px 16px 32px; }
    .hero-title { font-size: clamp(22px, 7vw, 36px); }
    .countdown-pill { padding: 9px 20px; }
    .nav-wrap { padding: 0; }
    .tab-btn { padding: 14px 14px; font-size: 11px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .stat-value { font-size: 32px; }
    .stat-card { padding: 16px; }
    .section-header { padding: 12px 14px; }
    .section-title-input { font-size: 17px; max-width: 180px; }
    .rsvp-summary { padding: 18px 14px; gap: 14px; grid-template-columns: repeat(2, 1fr); }
    .rsvp-num { font-size: 34px; }
    .rsvp-label { font-size: 9px; letter-spacing: 1.5px; }
    .vendor-table { width: 100%; }
    .vendor-table th, .vendor-table td { padding: 8px 6px; font-size: 11px; word-break: break-word; overflow-wrap: anywhere; }
    .vendor-table .editable-cell { font-size: 11px; }
    .vendor-table .pill { font-size: 10px; padding: 3px 7px; }
    .guest-table { min-width: 0; width: 100%; }
    .guest-table th { font-size: 9px; letter-spacing: 1px; padding: 8px 5px; white-space: normal; word-break: break-word; }
    .guest-table td { font-size: 11px; padding: 8px 5px; word-break: break-word; overflow-wrap: anywhere; }
    .guest-table .editable-cell { font-size: 11px; }
    .guest-table .pill { font-size: 10px; padding: 3px 6px; white-space: normal; }
    .checklist-item { padding: 11px 14px; gap: 10px; }
    .check-label { font-size: 13px; }
    .progress-label { padding: 8px 14px 4px; font-size: 11px; }
    .progress-bar-wrap { margin: 0 14px 14px; }
    .checklist-add { padding: 12px 14px; }
    .add-input { font-size: 13px; padding: 7px 10px; }
  }
  @media (max-width: 380px) {
    .hero-title { font-size: 20px; }
    .stats-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-value { font-size: 28px; }
    .rsvp-summary { grid-template-columns: 1fr 1fr; }
    .rsvp-num { font-size: 28px; }
    .section-title-input { font-size: 15px; max-width: 150px; }
    .guest-table th { font-size: 8px; padding: 6px 4px; }
    .guest-table td { font-size: 10px; padding: 6px 4px; }
    .guest-table .pill { font-size: 9px; padding: 3px 5px; }
  }
</style>
</head>

  <div class="tab-panel" id="tab-checklist">

</div>

  document.getElementById('cd-days').textContent = diff > 0 ? diff : 0;
}

function guestStats() {
  let invited = 0, confirmed = 0, declined = 0, awaiting = 0;
  guestData.forEach(cat => cat.items.forEach(g => {
    invited++;
    if (g.rsvp === 'confirmed') confirmed++;
    else if (g.rsvp === 'declined') declined++;
    else awaiting++;
  }));
  return { invited, confirmed, declined, awaiting, remaining: Math.max(0, 300 - invited) };
}
function vendorStats() {
  let total = 0, booked = 0;
  vendorData.forEach(c => c.items.forEach(v => { total++; if (v.booked === 'booked') booked++; }));
  return { total, booked };
}
function checklistStats() {
  let total = 0, done = 0;
  checklistData.forEach(c => c.items.forEach(i => { total++; if (i.done) done++; }));
  return { total, done };
}

    </div>

      <div class="stat-value">${cs.done}<span style="font-size:20px;color:var(--muted)">/${cs.total}</span></div>

  `;
}

function bookedPill(status) {
  if (status === 'booked') return `<span class="pill pill-green">Booked</span>`;
  return `<span class="pill pill-red">Not Booked</span>`;
}
function depositPill(status) {
  if (status === 'paid')    return `<span class="pill pill-green">Paid</span>`;
  if (status === 'pending') return `<span class="pill pill-amber">Pending</span>`;
  return `<span class="pill pill-grey">No Deposit</span>`;
}
function cycleBooked(catId, itemId) {
  const cat = vendorData.find(c=>c.id===catId);
  const item = cat.items.find(i=>i.id===itemId);
  item.booked = item.booked === 'booked' ? 'not booked' : 'booked';
  renderAll();
}
function cycleDeposit(catId, itemId) {
  const cat = vendorData.find(c=>c.id===catId);
  const item = cat.items.find(i=>i.id===itemId);
  const seq = ['none','pending','paid'];
  item.deposit = seq[(seq.indexOf(item.deposit)+1)%3];
  renderAll();
}
function updateVendorField(catId, itemId, field, val) {
  const cat = vendorData.find(c=>c.id===catId);
  const item = cat.items.find(i=>i.id===itemId);
  item[field] = val;
  renderOverview();
}
function updateCategoryTitle(catId, val, type) {
  if (type === 'vendor') vendorData.find(c=>c.id===catId).title = val;

}

  if (!str) return '';
